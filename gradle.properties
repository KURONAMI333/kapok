# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
# Values are the verified 1.21.1 matrix from NEW_MOD_GUIDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# ビルドは「対応する最低版」で行う。neoforge.mods.toml の依存下限が
# versionRange="[${neo_version},)" としてこの値から生成されるため、ここを上げると
# その版未満のパックで読み込み自体が拒否される（2026-11-07、247 でビルドしていたため
# 21.1.231/233 のパックで "requires neoforge 21.1.247 or above" で弾かれた）。
# 上げるときは対応下限を上げる判断として扱い、実起動で確かめてから変更する。
# 231 でビルド・全テスト green・実パック起動を確認済み。上位版（250/265）では前方互換で動く。
neo_version=21.1.231
loader_version_range=[1,)

# Mod identity
mod_id=kapok
mod_name=Kapok
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.kuronami.kapok
mod_authors=KURONAMI
mod_description=Keeps a large modpack from stalling on work it does not have to do now: mod files are read once at startup, and the server thread no longer waits on chunk loads, off-thread chunk requests, chunk post-processing or map previews. Drop one JAR into mods; it applies without configuration.
